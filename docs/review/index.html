<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14795d">
<title>Lesson review</title>
<style>
  :root{--ground:#eef1f6;--card:#fff;--card-border:#e7ebf0;--ink:#22303f;--ink-soft:#5b6773;--accent:#14795d;--shadow:rgba(30,50,80,.07);}
  @media (prefers-color-scheme:dark){:root{--ground:#10161d;--card:#1a2531;--card-border:#26333f;--ink:#e8eef4;--ink-soft:#a9b5c1;--accent:#3fbf92;--shadow:rgba(0,0,0,.35);}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:"Yu Gothic UI","Hiragino Kaku Gothic ProN","Meiryo","Noto Sans JP",system-ui,sans-serif;line-height:1.7;}
  .wrap{max-width:640px;margin:0 auto;padding:22px 16px 64px;}
  a.back{color:var(--ink-soft);font-size:.9rem;}
  h1{font-size:1.3rem;margin:8px 0 16px;}
  a.item{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--card-border);
    border-radius:14px;padding:16px 18px;margin:12px 0;box-shadow:0 2px 10px var(--shadow);}
  a.item:hover{border-color:var(--accent);}
  a.item b{font-size:1.1rem;} a.item span.d{display:block;color:var(--ink-soft);font-size:.92rem;}
  .icl{stroke:var(--accent)} .icw{stroke:#a8741f} .icf{fill:var(--accent);fill-opacity:.12} .ics{fill:var(--accent)}
  @media (prefers-color-scheme:dark){.icw{stroke:#d9a866}}
  a.item.has-ic{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px}
  a.item .ic{width:54px;height:54px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="ic-review" viewBox="0 0 48 48" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect class="icf icl" x="11" y="6" width="28" height="36" rx="3"/><path class="icl" d="M7 13h7M7 21h7M7 29h7M7 37h7"/><path class="icw" d="M19 24l5 5 9-11"/></symbol>
</svg>

<div class="wrap">
  <a class="back" href="../">← Words</a>
  <h1>Lesson review</h1>
  <a class="item has-ic" href="2026-10-03/"><span><b>3 Oct 2026 · 〜すぎます</b><span class="d">Rule, example sentences, words, conversation practice, homework</span></span><svg class="ic" aria-hidden="true"><use href="#ic-review"/></svg></a>
</div>
</body>
</html>
